name: Delete Kiri Page on PR Close

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    types:
    - closed

jobs:
  kiri-delete:
    runs-on: ubuntu-22.04
    steps:
    - name: Kiri
      uses: usa-reddragon/kiri-github-action@ff32169d6bfb377153dddee66c5f742a7a487a5d # v2.0.0
