name: KiBot

on:
  push:
    branches:
    - main
    paths:
    - 'kicad/**'
    - '.github/workflows/kibot.yaml'
  pull_request:
    paths:
    - 'kicad/**'
    - '.github/workflows/kibot.yaml'

jobs:
  kibot:
    runs-on: ubuntu-22.04
    container: ghcr.io/inti-cmnb/kicad7_auto:latest@sha256:78f021eb5d1f2dd5a7274f749f215aa55697fbf6eb60a228b0d3d006e4d7c18c
    steps:
    - uses: actions/checkout@v4
    - name: Cache 3D models data
      id: models-cache
      uses: set-soft/cache@main
      with:
        path: ~/cache_3d
        key: cache_3d
    - name: KiBot
      uses: INTI-CMNB/KiBot@v2_k8
      with:
        config: kicad/config.kibot.yaml
        schema: kicad/sneksafe.kicad_sch
        board: kicad/sneksafe.kicad_pcb
        cache3D: YES
        dir: Generated
    - name: Upload results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ always() }}
      with:
        name: KiBot
        path: Generated
