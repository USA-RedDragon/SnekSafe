name: KiBot

on:
  push:
    branches:
    - main
    paths:
    - 'kicad/**'
    - '.github/workflows/kibot.yaml'
  pull_request:
    paths:
    - 'kicad/**'
    - '.github/workflows/kibot.yaml'

jobs:
  kibot:
    runs-on: ubuntu-22.04
    container: ghcr.io/inti-cmnb/kicad7_auto:latest@sha256:78fdc2b692f59602543e05785d7704e595257f27c0ed6ba4aa5fe5c0cae3db77
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Cache 3D models data
      id: models-cache
      uses: set-soft/cache@baaa43ff1da8728ac1ac1f067c26a631830df13c # main
      with:
        path: ~/cache_3d
        key: cache_3d
    - name: KiBot
      uses: INTI-CMNB/KiBot@v2_k8
      with:
        config: kicad/config.kibot.yaml
        schema: kicad/sneksafe.kicad_sch
        board: kicad/sneksafe.kicad_pcb
        cache3D: YES
        dir: Generated
    - name: Upload results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: ${{ always() }}
      with:
        name: KiBot
        path: Generated
